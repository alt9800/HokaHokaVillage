<!-- ヒーローセクション -->
<div style="text-align: center; margin: 2em 0;">
    <h2>失敗したての情報をほかほかのうちに</h2>
</div>

<!-- GitHub Activity -->
<div id="clouds">...</div>

<!-- 最新記事（5-8件程度） -->
<section>
    <h2>最新の記録</h2>
    {% for post in site.posts limit:6 %}
        <!-- 記事カード -->
    {% endfor %}
    
    <div style="text-align: center;">
        <a href="/posts/">すべての記録を見る →</a>
    </div>
</section>

<style type="text/css">
    #clouds { 
        width: auto;
     }    
 </style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
<script>
VANTA.CLOUDS({
  el: "#clouds",
  mouseControls: true,
  touchControls: true,
  gyroControls: false,
  minHeight: 50.00,
  minWidth: 200.00,
  backgroundColor: 0xb0d7a1,
  skyColor: 0xd78f68,
  cloudColor: 0x8eabd7,
  cloudShadowColor: 0x692d57,
  sunlightColor: 0xd7b18b,
  speed: 0.50
})
</script>
