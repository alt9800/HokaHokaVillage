<!DOCTYPE html>
<html lang="ja">
<head>...</head>
<body>
    <div class="content">
        <!-- ヘッダー + ナビゲーション -->
        <header style="text-align: center; margin-bottom: 3em;">
            <h1>
                <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
            </h1>
            
            <!-- ナビゲーション -->
            <nav style="margin-top: 1.5em;">
                <a href="{{ '/' | relative_url }}" 
                   style="margin: 0 1em; padding: 0.5em 1em; {% if page.url == '/' %}background: var(--bg-secondary);{% endif %} border-radius: 4px;">
                    ホーム
                </a>
                <a href="{{ '/posts/' | relative_url }}" 
                   style="margin: 0 1em; padding: 0.5em 1em; {% if page.url contains '/posts' %}background: var(--bg-secondary);{% endif %} border-radius: 4px;">
                    記事一覧
                </a>
                <a href="{{ '/about/' | relative_url }}" 
                   style="margin: 0 1em; padding: 0.5em 1em; {% if page.url == '/about/' %}background: var(--bg-secondary);{% endif %} border-radius: 4px;">
                    About
                </a>
            </nav>
        </header>
        
        <main>{{ content }}</main>
        <footer>...</footer>
    </div>
</body>
</html>
