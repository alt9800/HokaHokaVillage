<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% else %}{{ site.lang | default: 'ja' }}{% endif %}">
<head>
  {% include head.html %}
  <link rel="icon" type="image/x-icon" href="/HokaHokaVillage/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/HokaHokaVillage/favicon.ico">
</head>

<body class="{% if page.layout %}layout-{{ page.layout }}{% endif %}{% if page.class %} {{ page.class }}{% endif %}">
  
  <div class="site-container">
    {% include header.html %}
    
    <main class="site-main" role="main">
      {{ content }}
    </main>
    
    {% include footer.html %}
  </div>
  
  <!-- 必要に応じてJavaScriptを読み込み -->
  {% if page.scripts %}
    {% for script in page.scripts %}
      <script src="{{ script | relative_url }}"></script>
    {% endfor %}
  {% endif %}
  
</body>
</html>
