<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<!-- SEO Meta Tags -->
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description | escape }}{% endif %}">
<meta name="author" content="{{ site.author | default: site.title }}">

<!-- Open Graph -->
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description | escape }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description | escape }}{% endif %}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- CSS -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<!-- Favicon -->
<!-- ファビコン（Safari対応強化版） -->

<!-- 方法A: 複数パターンを並行記述 -->
<link rel="icon" type="image/x-icon" href="/HokaHokaVillage/favicon.ico">
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | absolute_url }}">

<!-- 方法B: 短縮形も追加 -->
<link rel="shortcut icon" href="/HokaHokaVillage/favicon.ico">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">

<!-- 方法C: Safari特有の apple-touch-icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/HokaHokaVillage/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon.ico' | relative_url }}">

<!-- RSS Feed -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">

<!-- Preconnect for performance -->
<link rel="preconnect" href="https://overpass-api.de">
<link rel="dns-prefetch" href="https://hdyc.neis-one.org">
